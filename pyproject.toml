# Development tooling only. The plugin runs lib/herdr_projects directly and has
# no dependencies beyond Python 3.11+ and fzf.
[project]
name = "herdr-projects"
version = "0.1.0"
requires-python = ">=3.11"

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
